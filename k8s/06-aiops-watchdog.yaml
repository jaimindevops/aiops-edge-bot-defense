apiVersion: v1
kind: ServiceAccount
metadata:
  name: watchdog-sa
  namespace: netflex-aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: watchdog-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: watchdog-rolebinding
subjects:
- kind: ServiceAccount
  name: watchdog-sa
  namespace: netflex-aiops
roleRef:
  kind: ClusterRole
  name: watchdog-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: watchdog-script
  namespace: netflex-aiops
data:
  watchdog.py: |
    import os, sys, json, requests, urllib3, time
    from prometheus_client import start_http_server, Counter
    urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

    sys.stdout.reconfigure(line_buffering=True)
    print("🛡️ NetFlex Multi-Tier AIOps & Anti-DDoS Watchdog Active", flush=True)

    OLLAMA_URL = os.getenv("OLLAMA_URL", "http://ollama-inference.netflex-aiops.svc.cluster.local:11434")
    OLLAMA_MODEL = os.getenv("OLLAMA_MODEL", "gemma:2b")
    SLACK_URL = os.getenv("SLACK_WEBHOOK_URL", "").strip()

    METRIC_HTTP_REQ = Counter('netflex_http_requests_total', 'HTTP Requests Ingested', ['method', 'status', 'path'])
    METRIC_EDGE_DROPS = Counter('netflex_edge_cli_drops_total', 'Tier 1 Hard Rule CLI Drops')
    METRIC_RATE_LIMITS = Counter('netflex_l7_rate_limits_total', 'L7 Rate Limit Drops')
    METRIC_AI_THREATS = Counter('netflex_ai_sandbox_threats_total', 'Tier 2 AI Sandbox Threats', ['threat_type'])

    last_rate_limit_alert = 0

    def send_slack_alert(tier, client_ip, method, path, threat_type, details):
        if not SLACK_URL or not SLACK_URL.startswith("http"):
            print("⚠️ SLACK_URL not configured", flush=True)
            return

        if "Rate Limit" in tier:
            color = "#800080" # Purple
            title = "⚡ [NETFLEX L7 WAF: RATE LIMIT EXCEEDED]"
        elif "Tier 1" in tier:
            color = "#FFA500" # Orange
            title = "🚨 [NETFLEX EDGE WAF: IP DROPPED]"
        else:
            color = "#E50914" # Red
            title = "🔬 [NETFLEX AI SANDBOX: THREAT QUARANTINED]"

        payload = {
            "text": f"{title} - {threat_type} ({client_ip})",
            "attachments": [
                {
                    "color": color,
                    "title": title,
                    "fields": [
                        {"title": "Defense Layer", "value": tier, "short": True},
                        {"title": "Classification", "value": threat_type, "short": True},
                        {"title": "Source IP", "value": f"`{client_ip}`", "short": True},
                        {"title": "Target Endpoint", "value": f"`{method} {path}`", "short": True},
                        {"title": "Trigger / Forensics", "value": details, "short": False}
                    ],
                    "footer": "NetFlex Cloud-Native Security Engine | Azure Canada Central",
                    "ts": int(time.time())
                }
            ]
        }
        try:
            r = requests.post(SLACK_URL, json=payload, timeout=4)
            if r.status_code == 200:
                print(f"📬 [SLACK SENT] Dispatched {threat_type} alert to #netflex-secure-ops", flush=True)
            else:
                print(f"⚠️ Slack response: {r.status_code}", flush=True)
        except Exception as e:
            print(f"⚠️ Slack Alert dispatch error: {e}", flush=True)

    def ask_gemma_ai(client_ip, method, path, status, ua):
        prompt = (
            f"Analyze suspicious request: IP={client_ip}, Path={path}, UA={ua}.\n"
            f"Return JSON only: {{\"is_threat\": true, \"threat_type\": \"TYPE\", \"confidence\": \"95.0%\", \"reasoning\": \"brief summary\"}}"
        )
        try:
            r = requests.post(f"{OLLAMA_URL}/api/generate", json={
                "model": OLLAMA_MODEL,
                "prompt": prompt,
                "stream": False,
                "format": "json"
            }, timeout=8)
            if r.status_code == 200:
                res = json.loads(r.json().get("response", "{}"))
                if "threat_type" in res:
                    return res
        except Exception:
            pass

        lower_p = path.lower()
        if "select" in lower_p or "union" in lower_p or "1=1" in lower_p:
            return {"is_threat": True, "threat_type": "SQL_INJECTION", "confidence": "98.0%", "reasoning": "SQL syntax pattern detected in query parameters"}
        if "admin-trap" in lower_p or "sandbox-probe" in lower_p:
            return {"is_threat": True, "threat_type": "DMZ_HONEYPOT_PROBE", "confidence": "99.0%", "reasoning": f"Decoy honeypot endpoint probed: {path}"}
        return {"is_threat": False, "threat_type": "BENIGN", "confidence": "95.0%", "reasoning": "Legitimate user"}

    start_http_server(8000)

    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    with open(TOKEN_PATH, "r") as f:
        token = f.read().strip()

    headers = {"Authorization": f"Bearer {token}"}
    K8S_API = "https://kubernetes.default.svc"

    r = requests.get(f"{K8S_API}/api/v1/namespaces/ingress-nginx/pods?labelSelector=app.kubernetes.io/name=ingress-nginx", headers=headers, verify=False)
    items = r.json().get("items", [])
    if not items:
        sys.exit(1)

    ingress_pod = items[0]["metadata"]["name"]
    print(f"📡 Real-time JSON Log Stream Connected: {ingress_pod}", flush=True)

    log_stream_url = f"{K8S_API}/api/v1/namespaces/ingress-nginx/pods/{ingress_pod}/log?follow=true&tailLines=0"
    with requests.get(log_stream_url, headers=headers, stream=True, verify=False) as stream_resp:
        for raw_line in stream_resp.iter_lines():
            if not raw_line:
                continue
            line = raw_line.decode('utf-8', errors='ignore').strip()

            try:
                data = json.loads(line)
                client_ip = data.get("remote_addr", "-")
                method = data.get("request_method", "-")
                path = data.get("request_uri", "-")
                status = str(data.get("status", "200"))
                ua = data.get("http_user_agent", "")

                if any(ign in path for ign in ["/metrics", "/healthz", "favicon.ico"]):
                    continue

                METRIC_HTTP_REQ.labels(method=method, status=status, path=path).inc()

                # 1. TIER 1 HARD BLOCK (403 Drops)
                if status == "403":
                    METRIC_EDGE_DROPS.inc()
                    print(f"🛑 [TIER 1 HARD BLOCK] IP: {client_ip} | Path: {path} | User-Agent: {ua}", flush=True)
                    send_slack_alert("Tier 1 Ingress Edge WAF", client_ip, method, path, "CLI_BOT_SCRAPER", f"Blocked automated tool User-Agent: `{ua}`")
                    continue

                # 2. TIER 1.5 RATE LIMITING & DDOS (429 or 503 Drops)
                if status in ["429", "503"]:
                    METRIC_RATE_LIMITS.inc()
                    print(f"⚡ [RATE LIMIT {status}] IP: {client_ip} | Path: {path}", flush=True)
                    now = time.time()
                    if (now - last_rate_limit_alert) > 5:
                        last_rate_limit_alert = now
                        send_slack_alert("Layer 7 Token-Bucket Limiter", client_ip, method, path, "HTTP_FLOOD_BURST", f"Exceeded rate threshold (Status {status}). Client IP temporarily throttled.")
                    continue

                # 3. TIER 2 AI SANDBOX
                is_suspicious = any(sig in path.lower() for sig in ["admin-trap", "sandbox-probe", "select", "union", "1=1", "<script"])
                if is_suspicious:
                    verdict = ask_gemma_ai(client_ip, method, path, status, ua)
                    threat_type = verdict.get("threat_type", "UNKNOWN")
                    confidence = verdict.get("confidence", "95.0%")
                    reasoning = verdict.get("reasoning", "Decoy endpoint probe flagged in sandbox")

                    METRIC_AI_THREATS.labels(threat_type=threat_type).inc()
                    print(f"🤖 [TIER 2 SANDBOX VERDICT] Threat: {threat_type} ({confidence}) | IP: {client_ip}", flush=True)
                    send_slack_alert("Tier 2 Cognitive AI Sandbox", client_ip, method, path, f"{threat_type} ({confidence})", reasoning)
                else:
                    print(f"✅ [ALLOWED USER] IP: {client_ip} | Path: {path} | Status: 200", flush=True)

            except json.JSONDecodeError:
                continue
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflex-aiops-watchdog
  namespace: netflex-aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netflex-watchdog
  template:
    metadata:
      labels:
        app: netflex-watchdog
    spec:
      serviceAccountName: watchdog-sa
      containers:
      - name: watchdog
        image: python:3.11-slim
        env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: slack-security-secret
              key: SLACK_WEBHOOK_URL
              optional: true
        command:
        - /bin/sh
        - -c
        - |
          pip install -q --no-cache-dir requests prometheus_client urllib3
          python3 -u /app/watchdog.py
        volumeMounts:
        - name: script-vol
          mountPath: /app
        resources:
          limits:
            cpu: "300m"
            memory: "300Mi"
          requests:
            cpu: "50m"
            memory: "100Mi"
      volumes:
      - name: script-vol
        configMap:
          name: watchdog-script
