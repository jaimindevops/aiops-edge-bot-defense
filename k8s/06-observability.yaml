apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: netflex-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: 'netflex-aiops-watchdog'
        static_configs:
          - targets: ['netflex-watchdog.netflex-aiops.svc.cluster.local:8000']
      - job_name: 'ingress-nginx'
        static_configs:
          - targets: ['ingress-nginx-controller-metrics.ingress-nginx.svc.cluster.local:10254']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: netflex-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.51.0
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
        ports:
          - containerPort: 9090
        volumeMounts:
          - name: prometheus-config-volume
            mountPath: /etc/prometheus
        resources:
          limits:
            cpu: "250m"
            memory: "300Mi"
          requests:
            cpu: "50m"
            memory: "100Mi"
      volumes:
        - name: prometheus-config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: netflex-monitoring
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: netflex-monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus-service.netflex-monitoring.svc.cluster.local:9090
      isDefault: true
      editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: netflex-monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: netflex-dashboard-json
  namespace: netflex-monitoring
data:
  netflex-aiops.json: |-
    {
      "editable": true,
      "liveNow": true,
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["aiops", "f5-defense"],
      "time": {"from": "now-15m", "to": "now"},
      "title": "NetFlex AIOps Edge Defense & Delivery Dashboard",
      "uid": "netflex-aiops-dash",
      "panels": [
        {
          "id": 1,
          "title": "Total Gateway Ingested Requests",
          "type": "stat",
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 0},
          "datasource": {"type": "prometheus"},
          "targets": [{"datasource": {"type": "prometheus"}, "expr": "sum(netflex_http_requests_total) or vector(0)", "instant": true, "refId": "A"}]
        },
        {
          "id": 2,
          "title": "Malicious IPs Remediated (403 Block)",
          "type": "stat",
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 0},
          "datasource": {"type": "prometheus"},
          "targets": [{"datasource": {"type": "prometheus"}, "expr": "sum(netflex_ips_blocked_total) or vector(0)", "instant": true, "refId": "A"}],
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}}
        },
        {
          "id": 3,
          "title": "Threat Vector Breakdown",
          "type": "bargauge",
          "gridPos": {"h": 6, "w": 8, "x": 16, "y": 0},
          "datasource": {"type": "prometheus"},
          "targets": [{"datasource": {"type": "prometheus"}, "expr": "sum by (threat_type) (netflex_threats_detected_total)", "instant": true, "refId": "A"}]
        },
        {
          "id": 4,
          "title": "🤖 Gemma-2B Real-Time AI Security Triage Feed",
          "type": "table",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 6},
          "datasource": {"type": "prometheus"},
          "targets": [{"datasource": {"type": "prometheus"}, "expr": "netflex_security_incident_info", "format": "table", "instant": true, "refId": "A"}],
          "transformations": [
            {"id": "labelsToFields", "options": {"mode": "columns"}},
            {
              "id": "organize",
              "options": {
                "excludeByName": {"__name__": true, "instance": true, "job": true, "Value": true, "Time": true},
                "indexByName": {"timestamp": 0, "client_ip": 1, "threat_type": 2, "confidence": 3, "target_path": 4, "reasoning": 5},
                "renameByName": {
                  "timestamp": "Timestamp (UTC)",
                  "client_ip": "Client IP",
                  "threat_type": "Threat Vector",
                  "confidence": "AI Confidence",
                  "target_path": "Target Endpoint",
                  "reasoning": "Gemma LLM Reasoning"
                }
              }
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: netflex-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.4.0
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Admin"
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboard-json
          mountPath: /var/lib/grafana/dashboards
        resources:
          limits:
            cpu: "250m"
            memory: "250Mi"
          requests:
            cpu: "50m"
            memory: "100Mi"
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-provider
        configMap:
          name: grafana-dashboard-provider
      - name: dashboard-json
        configMap:
          name: netflex-dashboard-json
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: netflex-monitoring
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
